[project]
name = "subtitle-ai"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "faster-whisper==1.1.0",
    "ctranslate2==4.4.0",
    "transformers==4.48.3",
    "sentencepiece==0.2.0",
    "pyyaml==6.0.3",
    # Round-trip YAML for the glossary writers in api.py: pyyaml's safe_dump
    # drops every comment, and the series glossaries carry their evidence
    # (why each name is protected) as comments.
    "ruamel.yaml==0.18.16",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "langdetect==1.0.9",
    "python-multipart==0.0.20",
    # subtitle_ai/turns.py's fbank feature extraction (speaker-turn
    # detection, off by default -- see CLAUDE.md); already an incidental
    # transitive dependency of faster-whisper's VAD, pinned explicitly now
    # that it's a direct, unconditional import (pipeline.py imports turns
    # at module load regardless of whether turn detection is enabled).
    "numpy==2.5.3",
]

# Deliberately dropped from v1's dependency list: whisperx + matplotlib.
# faster-whisper 1.1.0's own word_timestamps=True (DTW-based, built in)
# produced accurate word-level timing in real-audio validation without a
# separate whisperx forced-alignment pass -- and whisperx pulls in
# pyannote.audio, which eagerly imports matplotlib.pyplot at module load
# time even though alignment never touches plotting (the old pyproject.toml
# carries a comment documenting exactly this friction). Removing the
# dependency removes the friction. Not yet rigorously A/B-tested against
# whisperx's alignment for word-timing accuracy at scale -- flagged as a
# known open question in the rebuild's final report, not silently assumed
# equivalent.

[tool.uv]
# triton (~555MB) is a hard requirement of the torch wheel but is only used by
# torch.compile/inductor, which this project never calls; torch and
# transformers import and run without it. An impossible marker makes uv skip
# it. Re-check if anything ever starts using torch.compile.
override-dependencies = ["triton; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Lint and type checks run in CI (.github/workflows/test.yml); versions are
# pinned there. Run locally with:
#   uvx ruff@0.16.10 check subtitle_ai scripts tests
#   uvx mypy@2.4.0 --python-executable .venv/bin/python
[tool.ruff]
target-version = "py312"
extend-exclude = ["frontend", "backups"]

[tool.ruff.lint]
# Correctness only: syntax/runtime errors, pyflakes (unused or undefined
# names), import placement. Not a style gate.
select = ["E4", "E7", "E9", "F"]
# Terse one-liners, `l` loop variables and lambda assignments are the house
# style here and not bugs.
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Tests unpack and bind values they don't assert on.
"tests/**" = ["F841"]

[tool.mypy]
files = ["subtitle_ai"]
mypy_path = "subtitle_ai"
explicit_package_bases = true
ignore_missing_imports = true

# Baseline: these modules had type errors when mypy was introduced
# (2026-10-02) and are excluded so CI is green and every OTHER module is
# checked. Fix a module, then delete it from this list.
[[tool.mypy.overrides]]
module = [
    "api", "cast_enrichment", "cast_metadata", "events", "glossary_profile",
    "jobstore", "pipeline", "reference_aligner", "srt_translation",
    "translate", "tvdb_client", "worker",
]
ignore_errors = true
