[project]
name = "subtitle-ai"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "faster-whisper==1.1.0",
    "ctranslate2==4.4.0",
    "transformers==4.48.3",
    "sentencepiece==0.2.0",
    "pyyaml==6.0.3",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "langdetect==1.0.9",
    "python-multipart==0.0.20",
]

# Deliberately dropped from v1's dependency list: whisperx + matplotlib.
# faster-whisper 1.1.0's own word_timestamps=True (DTW-based, built in)
# produced accurate word-level timing in real-audio validation without a
# separate whisperx forced-alignment pass -- and whisperx pulls in
# pyannote.audio, which eagerly imports matplotlib.pyplot at module load
# time even though alignment never touches plotting (the old pyproject.toml
# carries a comment documenting exactly this friction). Removing the
# dependency removes the friction. Not yet rigorously A/B-tested against
# whisperx's alignment for word-timing accuracy at scale -- flagged as a
# known open question in the rebuild's final report, not silently assumed
# equivalent.

[tool.uv]
# triton (~555MB) is a hard requirement of the torch wheel but is only used by
# torch.compile/inductor, which this project never calls; torch and
# transformers import and run without it. An impossible marker makes uv skip
# it. Re-check if anything ever starts using torch.compile.
override-dependencies = ["triton; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
