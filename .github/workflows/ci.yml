name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-fast-tests:
    # Unit + concurrency only: no model downloads, runs in well under a minute. The
    # integration suite (real ASR/VAD/translation) downloads multi-GB model weights and is
    # intentionally left for a separate, manually-triggered or nightly workflow rather than
    # gating every PR on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (needed by inspection/ranking unit tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install lightweight backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] pydantic pydantic-settings SQLAlchemy \
                      psutil numpy pytest pytest-asyncio httpx python-multipart
      - name: Unit + concurrency tests
        working-directory: backend
        run: PYTHONPATH=. pytest -m "unit or concurrency" -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm install
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  backend-integration-tests:
    # Real ASR/VAD/NLLB — downloads model weights, so kept manual/nightly rather than
    # on every push/PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - working-directory: backend
        run: |
          python -m pip install --upgrade pip "setuptools<81"
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation -r requirements.txt
      - working-directory: backend
        run: PYTHONPATH=. pytest -m integration -v
