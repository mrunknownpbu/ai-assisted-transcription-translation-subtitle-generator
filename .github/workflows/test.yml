name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"

      - name: Ruff
        run: uvx ruff@0.16.10 check subtitle_ai scripts tests

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          # Keep every application dependency pinned to uv.lock. Production
          # intentionally locks the CUDA build of torch; exclude it and its
          # CUDA-only runtime wheels here so the test runner remains CPU-only.
          uv sync --locked --no-install-package torch \
            --no-install-package nvidia-cublas-cu12 \
            --no-install-package nvidia-cuda-cupti-cu12 \
            --no-install-package nvidia-cuda-nvrtc-cu12 \
            --no-install-package nvidia-cuda-runtime-cu12 \
            --no-install-package nvidia-cudnn-cu12 \
            --no-install-package nvidia-cufft-cu12 \
            --no-install-package nvidia-curand-cu12 \
            --no-install-package nvidia-cusolver-cu12 \
            --no-install-package nvidia-cusparse-cu12 \
            --no-install-package nvidia-nccl-cu12 \
            --no-install-package nvidia-nvtx-cu12
          # Tests mock model inference, but gpu.py imports torch on some
          # cleanup paths. Install only the pinned CPU wheel; its remaining
          # dependencies were installed from uv.lock above.
          uv pip install --python .venv/bin/python --no-deps \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"

      - name: Type check
        # Uses the synced environment so third-party types resolve as they do
        # locally. Modules with a known baseline are listed in pyproject.toml.
        run: uvx mypy@2.4.0 --python-executable .venv/bin/python

      - name: Run tests
        working-directory: subtitle_ai
        run: ../.venv/bin/python -m unittest discover -s ../tests -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    # The full CUDA image is about 10 GB, too large to build safely on a hosted
    # runner (docs/deployment.md validates it by hand). This job checks the
    # Dockerfile and builds its frontend stage, which catches a broken
    # Dockerfile or frontend build context.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint the Dockerfile
        run: docker build --check .

      - name: Build the frontend stage
        run: docker build --target frontend-build -t subtitle-ai-frontend .
