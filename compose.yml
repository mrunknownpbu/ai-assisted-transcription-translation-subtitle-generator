services:
  subtitle-ai:
    image: subtitle-ai:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subtitle-ai
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      SUBTITLE_AI_DB: /cache/jobs.db
      SUBTITLE_AI_MEDIA_ROOT: /data
      SUBTITLE_AI_WORK_ROOT: /cache/work
      SUBTITLE_AI_GLOSSARY_DIR: /glossary
      # Serializes GPU-heavy sections (model load through free) across
      # every process that mounts this same /cache path -- confirmed
      # necessary by a real CUDA OOM when two jobs loaded large-v3
      # concurrently on this 8GB card. A future horizontally-scaled
      # deployment sharing this cache path gets safe GPU queuing for
      # free; a single replica just gets this against its own API's
      # stream-sampling endpoint, which is otherwise unsynchronized with
      # the worker thread in the same process.
      SUBTITLE_AI_GPU_LOCK: /cache/.gpu.lock
      # Persistent ASR-transcript cache, keyed on media+stream+model+
      # pipeline-version (see transcript.py). Lives under the same /cache
      # mount as the job database, not a per-job scratch dir -- the whole
      # point is surviving across jobs and container restarts. A retry
      # always bypasses this (see worker.py) so it can never make Retry a
      # no-op after a bad transcription.
      SUBTITLE_AI_TRANSCRIPT_CACHE: /cache/transcripts
      # Unset by default = local translation only. Set to route translation
      # through a remote GPU host instead via translate_server.py, with
      # automatic local fallback if it's unreachable -- see
      # translate.remote_translate_batch()'s docstring. This host's own
      # value (if any) lives in its .env, not here, so a fresh checkout on
      # a new host defaults to local-only rather than silently trying an
      # old deployment's remote server.
      TRANSLATE_SERVER_URL: ${TRANSLATE_SERVER_URL:-}
      TRANSLATE_SERVER_API_KEY: ${TRANSLATE_SERVER_API_KEY:-}
      # Optional TheTVDB API v4 credentials (see tvdb_client.py) -- metadata
      # enrichment only (series title, per-episode characters), never a runtime
      # dependency for translation itself. Left unset by default: every
      # function in tvdb_client.py degrades to None/empty with no key
      # configured, exactly today's production behavior. Set via .env
      # (see .env.example) to enable it.
      TVDB_API_KEY: ${TVDB_API_KEY:-}
      TVDB_API_PIN: ${TVDB_API_PIN:-}
      # Optional TMDB v3 API key: per-episode cast/guest-star credits for
      # cast_metadata.py (with TVDB and the key-free IMDb datasets).
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Empty = re-check each series' cast metadata every 30 days while the
      # worker is idle; 0 disables (see cast_enrichment.py).
      SUBTITLE_AI_CAST_REFRESH_DAYS: ${SUBTITLE_AI_CAST_REFRESH_DAYS:-}
      # Optional Sonarr/Radarr (arr_client.py): what series/movie a file is,
      # with its TVDB/TMDB/IMDb/TVmaze ids and original language. Preferred
      # over {tvdb-<id>} folder tags when set.
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      # Optional Plex/Jellyfin (media_servers.py): after a job writes a
      # subtitle, rescan just that folder/file. SUBTITLE_AI_MEDIA_REFRESH=off
      # disables it.
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      SUBTITLE_AI_MEDIA_REFRESH: ${SUBTITLE_AI_MEDIA_REFRESH:-}
      # Empty = on: fix character names Whisper mishears as a near-identical
      # name ("Aydın" -> "Aydan"), from the episode's cast (name_correction.py).
      SUBTITLE_AI_NAME_CORRECTION: ${SUBTITLE_AI_NAME_CORRECTION:-}
      # Optional job-failure webhook (see alerting.py) -- unset by
      # default, matching today's behavior (silent failure until the UI
      # is checked).
      FAILURE_WEBHOOK_URL: ${FAILURE_WEBHOOK_URL:-}
      # Optional shared-secret header required on mutating endpoints
      # (see api.py's require_api_key()) -- unset by default, matching
      # this deployment's confirmed LAN-only status.
      SUBTITLE_AI_API_KEY: ${SUBTITLE_AI_API_KEY:-}
      # The container listens on 0.0.0.0, so without a key it refuses to
      # start unless this acknowledges an open API on a trusted network.
      # Log format (text|json) and level; see logging_setup.py.
      SUBTITLE_AI_LOG_FORMAT: ${SUBTITLE_AI_LOG_FORMAT:-}
      SUBTITLE_AI_LOG_LEVEL: ${SUBTITLE_AI_LOG_LEVEL:-}
      # Off (empty) = every job transcribes afresh; on = reuse a cached transcript.
      SUBTITLE_AI_REUSE_TRANSCRIPT_CACHE: ${SUBTITLE_AI_REUSE_TRANSCRIPT_CACHE:-}
      SUBTITLE_AI_ALLOW_INSECURE: ${SUBTITLE_AI_ALLOW_INSECURE:-}
      SUBTITLE_AI_BIND_HOST: ${SUBTITLE_AI_BIND_HOST:-}
      # Empty = defaults (24h failed-job scratch retention; ASR hotwords
      # off). See .env.example for what each does.
      SUBTITLE_AI_FAILED_WORK_RETENTION_HOURS: ${SUBTITLE_AI_FAILED_WORK_RETENTION_HOURS:-}
      SUBTITLE_AI_ASR_HOTWORDS: ${SUBTITLE_AI_ASR_HOTWORDS:-}
      # Empty = code defaults, same convention as above (all three are
      # blank-safe): "small" Whisper model for the library's Analyze
      # button (falls back to large-v3 if not pre-cached -- see
      # scripts/download_sample_model.py); 3.2GB of free VRAM required
      # before a large model load (gpu.preflight_vram_check()); orphan-
      # word context grounding on (off/0/false/no disables it).
      # Previously read by the app but never forwarded here, so setting
      # them in .env silently did nothing.
      SUBTITLE_AI_SAMPLE_MODEL: ${SUBTITLE_AI_SAMPLE_MODEL:-}
      SUBTITLE_AI_VRAM_MARGIN_GB: ${SUBTITLE_AI_VRAM_MARGIN_GB:-}
      SUBTITLE_AI_ORPHAN_CONTEXT_PADDING: ${SUBTITLE_AI_ORPHAN_CONTEXT_PADDING:-}
      SUBTITLE_AI_CODE_SWITCH_DETECTION: ${SUBTITLE_AI_CODE_SWITCH_DETECTION:-}
      # Empty = int8 (see asr.py's AsrConfig.compute_type comment for which
      # GPUs need which value). Set to float16 on a GPU with efficient
      # float16 tensor throughput (Ampere+, e.g. an RTX 3070) for faster ASR.
      SUBTITLE_AI_COMPUTE_TYPE: ${SUBTITLE_AI_COMPUTE_TYPE:-}
      # Empty = dedicated-GPU profile (this host). See .env.example: set
      # SUBTITLE_AI_GPU_SHARED on a card shared with transcoders; the two
      # NLLB knobs override the profile's batch/beam sizing.
      SUBTITLE_AI_GPU_SHARED: ${SUBTITLE_AI_GPU_SHARED:-}
      SUBTITLE_AI_NLLB_BATCH_SIZE: ${SUBTITLE_AI_NLLB_BATCH_SIZE:-}
      SUBTITLE_AI_NLLB_NUM_BEAMS: ${SUBTITLE_AI_NLLB_NUM_BEAMS:-}
      # Natural-dialogue plan (2026-09-28), both empty = off by default --
      # see CLAUDE.md for the measured reasons neither is on yet.
      # heuristic|voice turn on subtitle_ai/turns.py's speaker-turn
      # detection (turns.py); natural selects asr.py's initial_prompt
      # style experiment.
      SUBTITLE_AI_TURN_DETECTION: ${SUBTITLE_AI_TURN_DETECTION:-}
      SUBTITLE_AI_ASR_STYLE: ${SUBTITLE_AI_ASR_STYLE:-}
      # Final subtitle display constraints (subtitle_constraints.py). Empty
      # values retain the centralized production defaults.
      SUBTITLE_AI_MIN_CUE_DURATION: ${SUBTITLE_AI_MIN_CUE_DURATION:-}
      SUBTITLE_AI_TARGET_CUE_DURATION_MIN: ${SUBTITLE_AI_TARGET_CUE_DURATION_MIN:-}
      SUBTITLE_AI_TARGET_CUE_DURATION_MAX: ${SUBTITLE_AI_TARGET_CUE_DURATION_MAX:-}
      SUBTITLE_AI_MAX_CUE_DURATION: ${SUBTITLE_AI_MAX_CUE_DURATION:-}
      SUBTITLE_AI_MAX_CHARS_PER_LINE: ${SUBTITLE_AI_MAX_CHARS_PER_LINE:-}
      SUBTITLE_AI_MAX_LINES: ${SUBTITLE_AI_MAX_LINES:-}
      SUBTITLE_AI_MAX_CPS: ${SUBTITLE_AI_MAX_CPS:-}
      SUBTITLE_AI_TARGET_CPS: ${SUBTITLE_AI_TARGET_CPS:-}
      # Empty = keep NLLB loaded 600s between jobs (0 when GPU_SHARED).
      SUBTITLE_AI_MODEL_IDLE_SECONDS: ${SUBTITLE_AI_MODEL_IDLE_SECONDS:-}
      # Empty = ct2 (falls back to hf if scripts/convert_nllb_ct2.py hasn't
      # been run on this host).
      SUBTITLE_AI_NLLB_BACKEND: ${SUBTITLE_AI_NLLB_BACKEND:-}
      SUBTITLE_AI_NLLB_CT2_PATH: ${SUBTITLE_AI_NLLB_CT2_PATH:-}
    volumes:
      - ${DATA_PATH}:/data
      # Read-only: confirmed safe by real GPU inference runs this session
      # (faster-whisper's harmless hub-cache commit-hash write is simply
      # ignored on failure) -- the app has no legitimate reason to write
      # into model weights.
      - ${CONFIG_PATH}/subtitle-ai/models:/models:ro
      # Consolidated onto the plain subtitle-ai appdata name (2026-09-27):
      # this used to live under the pre-rename subtitle-ai-v2 name, kept
      # around because renaming a live job db/work dir is a data-migration
      # operation, not part of an image rename -- since done, with the
      # container stopped and every file verified byte-identical at its
      # new location before the old directory was removed.
      - ${CONFIG_PATH}/subtitle-ai/cache:/cache
      # Read-write (changed 2026-09-19): the app now writes here itself --
      # POST /api/series/{tvdb_id}/glossary/promote (one-click promotion
      # of a mined suggestion into a real, translation-affecting entity)
      # needs to create/update series glossary files. Still fully
      # contained to this app's own dedicated config folder, owned by the
      # same uid (1000) the container already runs as -- no broader
      # permission granted.
      - ${CONFIG_PATH}/subtitle-ai/glossary:/glossary
    ports:
      - "8099:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
